name: ci

on:
  pull_request:
    # `labeled`: poner la etiqueta `smoke` a un PR dispara también el job de punta a punta.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    tags: ["entrega-*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-y-pruebas:
    name: lint-y-pruebas
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: prueba
          POSTGRES_PASSWORD: prueba
          POSTGRES_DB: prueba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prueba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://prueba:prueba@localhost:5432/prueba
      # Puerto cerrado a propósito: las pruebas no deben depender de MLflow.
      MLFLOW_TRACKING_URI: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v5

      - name: Sin datos ni credenciales versionados
        run: |
          prohibidos=$(git ls-files | grep -E \
            '(^|/)data/|\.(csv|parquet|pkl|joblib|pdf|zip)$|(^|/)\.env$|(^|/)\.env\.' \
            | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$prohibidos" ]; then
            echo "::error::Archivos prohibidos en el repo:"; echo "$prohibidos"; exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -e .
          pip check

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: Pytest
        run: pytest

  dags:
    name: dags
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar Airflow (misma versión y constraints que la imagen)
        run: |
          python -m pip install --upgrade pip
          pip install "apache-airflow==3.3.2" pytest==9.2.0 \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.11.txt"

      - name: Pytest del DAG
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: pytest -p no:cacheprovider tests/test_dags.py

  compose:
    name: compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Configuración de Compose válida (con .env.example sin editar)
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose config --format json > /tmp/compose.json

      - name: Servicio mlflow, API en 8000, sin puertos de Postgres y sin 'latest'
        shell: python3 {0}
        run: |
          import glob, json, re, sys
          s = json.load(open("/tmp/compose.json"))["services"]
          errores = []
          if "mlflow" not in s:
              errores.append("falta el servicio 'mlflow'")
          api = s.get("api", {}).get("ports", [])
          if not any(str(p.get("published")) == "8000" and p.get("target") == 8000 for p in api):
              errores.append("la API debe publicar 8000:8000")
          for nombre in ("db", "airflow-db"):
              if s.get(nombre, {}).get("ports"):
                  errores.append(f"'{nombre}' no debe publicar puertos")
          imagenes = {n: v.get("image", "") for n, v in s.items()}
          for f in glob.glob("docker/*/Dockerfile"):
              for linea in open(f):
                  if linea.startswith("FROM "):
                      imagenes[f] = linea.split()[1]
          for origen, img in imagenes.items():
              tag = img.rsplit("/", 1)[-1].partition(":")[2]
              if not re.search(r"\d", tag) or "latest" in tag:
                  errores.append(f"{origen}: imagen sin versión fija ({img!r})")
          if errores:
              print("\n".join(errores))
              sys.exit(1)
          print("compose OK:", ", ".join(sorted(s)))

      - name: Hadolint
        run: |
          for f in docker/*/Dockerfile; do
            echo "== $f"
            docker run --rm -i hadolint/hadolint:v2.14.0 hadolint --failure-threshold warning - < "$f"
          done

      - name: Build de las imágenes
        run: docker compose build

  # De punta a punta con datos SINTÉTICOS (nunca los publicados): levanta el stack completo y
  # corre scripts/smoke.py (contrato, 422, idempotencia, reentreno, caída de MLflow).
  # Corre en main, en los tags de entrega, a mano y en PRs con la etiqueta `smoke`.
  smoke:
    name: smoke
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'smoke')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # `runner.temp` no existe en el `env` del job: la ruta se exporta desde un paso.
      - name: Carpeta de datos
        run: echo "DATOS_DIR=$RUNNER_TEMP/datos-sinteticos" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar el paquete (cliente del smoke y generador de datos)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -e .

      - name: Datos sintéticos
        run: python -m novamercado.sintetico "$DATOS_DIR"

      - name: Levantar el stack (con .env.example sin editar)
        run: |
          cp .env.example .env
          export AIRFLOW_UID=$(id -u)
          docker compose build
          docker compose up -d

      - name: Smoke
        run: PYTHONPATH=src python scripts/smoke.py --mlflow --salida smoke.json

      - name: Logs si falla
        if: failure()
        run: docker compose ps -a && docker compose logs --tail 150

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke
          path: smoke.json
          if-no-files-found: ignore
