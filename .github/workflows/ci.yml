name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-y-pruebas:
    name: lint-y-pruebas
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: prueba
          POSTGRES_PASSWORD: prueba
          POSTGRES_DB: prueba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prueba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://prueba:prueba@localhost:5432/prueba
      # Puerto cerrado a propósito: las pruebas no deben depender de MLflow.
      MLFLOW_TRACKING_URI: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v5

      - name: Sin datos ni credenciales versionados
        run: |
          prohibidos=$(git ls-files | grep -E \
            '(^|/)data/|\.(csv|parquet|pkl|joblib|pdf|zip)$|(^|/)\.env$|(^|/)\.env\.' \
            | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$prohibidos" ]; then
            echo "::error::Archivos prohibidos en el repo:"; echo "$prohibidos"; exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -e .
          pip check

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: Pytest
        run: pytest
